name: curelink_alarm_bridge
description: Native alarm channel available to foreground and WorkManager Flutter engines.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.curelink.alarmbridge
        pluginClass: CureLinkAlarmBridgePlugin
